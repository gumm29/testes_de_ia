name: Notify on new pull request

on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check SMTP configuration
        id: smtp
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        shell: bash
        run: |
          if [[ -z "$SMTP_HOST" || -z "$SMTP_PORT" || -z "$SMTP_USERNAME" || -z "$SMTP_PASSWORD" || -z "$SMTP_FROM" || -z "$SMTP_SECURE" || -z "$NOTIFY_EMAIL" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Configure os repository secrets SMTP e NOTIFY_EMAIL para habilitar os avisos por email."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email notification
        if: steps.smtp.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_SECURE }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[testes_de_ia] Novo PR: ${{ github.event.pull_request.title }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            Um novo pull request foi aberto no repositorio testes_de_ia.

            Titulo: ${{ github.event.pull_request.title }}
            Autor: ${{ github.event.pull_request.user.login }}
            Destino: ${{ github.event.pull_request.base.ref }}
            URL: ${{ github.event.pull_request.html_url }}
